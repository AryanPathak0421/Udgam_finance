<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <script>
      (function() {
        var isSupervisor = window.location.pathname.startsWith('/supervisor');
        var isMember = window.location.pathname.startsWith('/member');
        var isEmployee = window.location.pathname.startsWith('/employee');

        var manifestHref = '/manifest-software.webmanifest';
        var appTitle = 'Udgam Finance';
        var themeColor = '#107870';
        var iconHref = '/logo.png';

        if (isSupervisor) {
          manifestHref = '/manifest-supervisor.webmanifest';
          appTitle = 'Udgam Supervisor';
          themeColor = '#0f766e';
          iconHref = '/icon-supervisor-192.png';
        } else if (isMember) {
          manifestHref = '/manifest-member.webmanifest';
          appTitle = 'Udgam Member';
          themeColor = '#059669';
          iconHref = '/icon-member-192.png';
        } else if (isEmployee) {
          manifestHref = '/manifest.webmanifest';
          appTitle = 'Udgam Staff';
          themeColor = '#107870';
          iconHref = '/icon-192.png';
        }

        var link = document.createElement('link');
        link.id = 'app-manifest-link';
        link.rel = 'manifest';
        link.href = manifestHref;
        document.head.appendChild(link);

        var appleIcon = document.createElement('link');
        appleIcon.rel = 'apple-touch-icon';
        appleIcon.href = iconHref;
        document.head.appendChild(appleIcon);

        var metaTheme = document.createElement('meta');
        metaTheme.name = 'theme-color';
        metaTheme.content = themeColor;
        document.head.appendChild(metaTheme);

        var metaTitle = document.createElement('meta');
        metaTitle.name = 'apple-mobile-web-app-title';
        metaTitle.content = appTitle;
        document.head.appendChild(metaTitle);
      })();

      // Capture beforeinstallprompt immediately on page load
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-available', { detail: e }));
      });
      window.addEventListener('appinstalled', function() {
        window.__pwaInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Udgam Microfinance</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('ServiceWorker registration error:', err);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
