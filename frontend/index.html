<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <script>
      (function() {
        var isSupervisor = window.location.pathname.startsWith('/supervisor');
        var isMember = window.location.pathname.startsWith('/member');
        var link = document.createElement('link');
        link.id = 'app-manifest-link';
        link.rel = 'manifest';
        link.href = isSupervisor ? '/manifest-supervisor.webmanifest' : '/manifest.webmanifest';
        document.head.appendChild(link);

        var appleIcon = document.createElement('link');
        appleIcon.rel = 'apple-touch-icon';
        appleIcon.href = isSupervisor ? '/icon-supervisor-192.png' : '/icon-192.png';
        document.head.appendChild(appleIcon);

        var metaTheme = document.createElement('meta');
        metaTheme.name = 'theme-color';
        metaTheme.content = isSupervisor ? '#0f766e' : (isMember ? '#059669' : '#107870');
        document.head.appendChild(metaTheme);

        var metaTitle = document.createElement('meta');
        metaTitle.name = 'apple-mobile-web-app-title';
        metaTitle.content = isSupervisor ? 'Udgam Supervisor' : (isMember ? 'Udgam Member' : 'Udgam Staff');
        document.head.appendChild(metaTitle);
      })();

      // Capture beforeinstallprompt immediately on page load
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-available', { detail: e }));
      });
      window.addEventListener('appinstalled', function() {
        window.__pwaInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Udgam Microfinance</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('ServiceWorker registration error:', err);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
